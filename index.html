<style>
/* =========================================================================
   THE WHITBY INVITATIONAL — ARCADE CABINET
   The page is the cabinet's screen. Phosphor green is the live layer,
   amber is first place, cyan labels the chrome, magenta is damage only.
   ========================================================================= */
:root {
  --void:      #070B08;
  --screen:    #0C130E;
  --panel:     #111B13;
  --panel-2:   #16241A;
  --grid:      #1F3324;
  --grid-hi:   #2C4732;

  --phos:      #4BE87C;
  --phos-dim:  #2F9B54;
  --amber:     #FFC233;
  --cyan:      #56D8F0;
  --magenta:   #FF3D7F;
  --paper:     #DDF3E2;
  --mute:      #7E9C87;

  --shell: min(1180px, 100% - 28px);
}

* { box-sizing: border-box; }
html { scroll-padding-top: 118px; }
html, body { background: var(--void); }
body {
  margin: 0;
  font-family: 'VT323', 'Courier New', monospace;
  font-size: 20px;
  line-height: 1.45;
  color: var(--paper);
  background:
    radial-gradient(120% 80% at 50% 0%, #101A12 0%, var(--screen) 45%, var(--void) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ---- CRT overlays: scanlines + vignette. Fixed, never interactive. ---- */
.crt-lines, .crt-vignette { position: fixed; inset: 0; pointer-events: none; z-index: 9000; }
.crt-lines {
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.30) 0px,
    rgba(0,0,0,0.30) 1px,
    rgba(0,0,0,0) 1px,
    rgba(0,0,0,0) 3px
  );
  mix-blend-mode: multiply;
  opacity: 0.55;
}
.crt-vignette {
  background: radial-gradient(115% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.62) 100%);
}

/* ---- type roles ---- */
.pix {
  font-family: 'Silkscreen', 'Courier New', monospace;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.15;
  text-transform: uppercase;
}
.pix-r { font-family: 'Silkscreen', monospace; font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; }
.num { font-variant-numeric: tabular-nums; }

a { color: var(--cyan); text-decoration: none; border-bottom: 1px solid var(--grid-hi); }
a:hover { color: var(--phos); border-bottom-color: var(--phos); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

.wrap { width: var(--shell); margin: 0 auto; }
main, .hud, footer { position: relative; z-index: 2; }

/* =========================== CABINET HUD =========================== */
.hud {
  position: sticky; top: 0; z-index: 500;
  background: linear-gradient(180deg, #0A110C 70%, rgba(10,17,12,0.94) 100%);
  border-bottom: 2px solid var(--grid-hi);
}
.hud-score {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 9px 0 7px;
  font-family: 'Silkscreen', monospace; font-weight: 400;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--mute);
  border-bottom: 1px solid var(--grid);
}
.hud-score b { font-weight: 700; color: var(--phos); }
.hud-score .gold { color: var(--amber); }
.hud-nav {
  display: flex; gap: 4px; flex-wrap: wrap;
  padding: 7px 0 8px;
}
.hud-nav a {
  font-family: 'Silkscreen', monospace; font-weight: 400;
  font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--mute);
  padding: 5px 9px 5px 8px;
  border: 0; border-radius: 0;
  position: relative;
}
.hud-nav a::before { content: "\00a0\00a0"; }
.hud-nav a:hover, .hud-nav a:focus-visible {
  color: var(--screen); background: var(--phos);
}
.hud-nav a:hover::before, .hud-nav a:focus-visible::before { content: "\25B8\00a0"; }

/* =========================== SECTIONS =========================== */
section { padding: 72px 0 8px; }
.sec-head { margin-bottom: 26px; }
.sec-title {
  font-family: 'Silkscreen', monospace; font-weight: 700;
  font-size: clamp(19px, 2.6vw, 30px);
  letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--phos);
  text-shadow: 2px 2px 0 #0A3F1E;
}
.sec-sub { color: var(--mute); font-size: 19px; margin-top: 8px; max-width: 62ch; }
.sec-rule {
  height: 4px; margin: 14px 0 0;
  background: repeating-linear-gradient(90deg, var(--phos-dim) 0 8px, transparent 8px 16px);
}

/* =========================== ATTRACT / HERO =========================== */
.attract { text-align: center; padding-top: 54px; }
.marquee {
  font-family: 'Silkscreen', monospace; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.01em;
  line-height: 1.12;
  font-size: clamp(21px, 7.2vw, 82px);
  color: var(--paper);
  text-shadow:
     3px 0 0 var(--magenta),
    -3px 0 0 var(--cyan),
     0 5px 0 #06331A,
     0 6px 22px rgba(75,232,124,0.30);
  margin: 0;
}
.marquee .lo { display: block; color: var(--amber); text-shadow: 3px 0 0 var(--magenta), -3px 0 0 var(--cyan), 0 5px 0 #3A2603; }
.attract-sub {
  font-family: 'Silkscreen', monospace; font-weight: 400;
  font-size: clamp(9px, 1.3vw, 12px); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--mute); margin-top: 22px;
}
.blink { animation: blink 1.05s steps(1, end) infinite; }
@keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
.press-start {
  display: inline-block; margin-top: 30px;
  font-family: 'Silkscreen', monospace; font-weight: 700;
  font-size: clamp(12px, 1.8vw, 17px); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--amber);
  background: none; border: 0; cursor: pointer; padding: 8px 4px;
}
.press-start:hover { color: var(--phos); }

.hud-stats {
  display: grid; grid-template-columns: repeat(5, 1fr);
  margin-top: 46px;
  border: 2px solid var(--grid-hi); background: var(--panel);
}
.hud-stats > div { padding: 14px 10px 12px; border-right: 2px solid var(--grid-hi); }
.hud-stats > div:last-child { border-right: 0; }
.hud-stat-k {
  font-family: 'Silkscreen', monospace; font-weight: 400;
  font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--cyan);
}
.hud-stat-v {
  font-family: 'Silkscreen', monospace; font-weight: 700;
  font-size: clamp(15px, 2.4vw, 26px); color: var(--phos); margin-top: 9px;
  font-variant-numeric: tabular-nums;
}
@media (max-width: 720px) {
  .hud-stats { grid-template-columns: repeat(2, 1fr); }
  .hud-stats > div { border-bottom: 2px solid var(--grid-hi); }
  .hud-stats > div:nth-child(2n) { border-right: 0; }
  .hud-stats > div:last-child { grid-column: 1 / -1; border-bottom: 0; }
}

/* =========================== PANELS =========================== */
.panel {
  background: var(--panel);
  border: 2px solid var(--grid-hi);
}
.panel-pad { padding: 22px 20px; }
.panel-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--panel-2);
  border-bottom: 2px solid var(--grid-hi);
  font-family: 'Silkscreen', monospace; font-weight: 700;
  font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--phos);
}
.panel-head .rt { font-weight: 400; color: var(--mute); }

/* =========================== WINNER SPLASH =========================== */
.winner-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 34px; align-items: start; }
@media (max-width: 860px) { .winner-grid { grid-template-columns: 1fr; } }
.winner-tag {
  font-family: 'Silkscreen', monospace; font-weight: 700;
  font-size: clamp(13px, 1.9vw, 18px); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--amber);
}
.champ-name {
  font-family: 'Silkscreen', monospace; font-weight: 700;
  font-size: clamp(34px, 6.6vw, 74px); line-height: 1; text-transform: uppercase;
  color: var(--phos);
  text-shadow: 4px 4px 0 #073A1D, 0 0 26px rgba(75,232,124,0.28);
  margin: 14px 0 0;
  word-break: break-word;
}
.stat-strip { display: flex; gap: 0; flex-wrap: wrap; margin-top: 22px; border: 2px solid var(--grid-hi); }
.stat-strip > div { flex: 1 1 90px; padding: 11px 12px; border-right: 2px solid var(--grid-hi); }
.stat-strip > div:last-child { border-right: 0; }
.stat-k { font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); }
.stat-v { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 20px; color: var(--paper); margin-top: 7px; font-variant-numeric: tabular-nums; }

.crt-photo { position: relative; border: 3px solid var(--grid-hi); background: #000; }
.crt-photo img { display: block; width: 100%; height: auto; }
.crt-photo::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0.34) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(100% 80% at 50% 40%, rgba(75,232,124,0.06), rgba(0,0,0,0.42));
}
.crt-photo .corner {
  position: absolute; width: 11px; height: 11px; border: 3px solid var(--amber);
}
.crt-photo .c1 { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.crt-photo .c2 { top: -3px; right: -3px; border-left: 0; border-bottom: 0; }
.crt-photo .c3 { bottom: -3px; left: -3px; border-right: 0; border-top: 0; }
.crt-photo .c4 { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }

.dialogue {
  margin-top: 20px; padding: 16px 18px 14px;
  border: 3px solid var(--phos-dim); background: #08130C;
  font-size: 23px; line-height: 1.35; color: var(--paper);
}
.dialogue .who {
  display: block; margin-top: 12px;
  font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--cyan);
}
.dialogue .caret { color: var(--phos); }

.champ-shot img { max-height: 520px; object-fit: cover; object-position: center 22%; }
.final-board { margin-top: 22px; border: 2px solid var(--grid-hi); }
.final-head {
  font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--cyan);
  padding: 9px 14px; background: var(--panel-2); border-bottom: 2px solid var(--grid-hi);
}
.final-row {
  display: grid; grid-template-columns: 46px 1fr auto 58px; gap: 12px; align-items: baseline;
  padding: 9px 14px; border-bottom: 1px solid var(--grid);
}
.final-row:last-child { border-bottom: 0; }
.fr-pos { font-family: 'Silkscreen', monospace; font-size: 11px; color: var(--mute); }
.fr-name { font-family: 'Silkscreen', monospace; font-size: 12px; text-transform: uppercase; color: var(--paper); }
.fr-pts { color: var(--phos); font-variant-numeric: tabular-nums; }
.fr-str { color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }
.final-row.lead .fr-pos, .final-row.lead .fr-name { color: var(--amber); }
</style>
<style>
/* =========================== MODE SELECT (format tabs) =========================== */
.stage-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.stage-tab {
  display: flex; flex-direction: column; gap: 7px; align-items: flex-start;
  background: var(--panel); border: 2px solid var(--grid-hi); border-radius: 0;
  padding: 12px 18px 11px; cursor: pointer; min-width: 116px;
}
.stage-tab .st-label {
  font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 13px;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute);
}
.stage-tab .st-sub {
  font-family: 'Silkscreen', monospace; font-size: 9px;
  letter-spacing: 0.09em; text-transform: uppercase; color: var(--phos-dim);
}
.stage-tab:hover { border-color: var(--phos-dim); }
.stage-tab:hover .st-label { color: var(--paper); }
.stage-tab[aria-selected="true"] { background: var(--phos); border-color: var(--phos); }
.stage-tab[aria-selected="true"] .st-label { color: var(--screen); }
.stage-tab[aria-selected="true"] .st-sub { color: #0A3F1E; }
.stage-tab.is-next .st-sub { color: var(--amber); }
.stage-tab.is-next[aria-selected="true"] { background: var(--amber); border-color: var(--amber); }
.stage-tab.is-next[aria-selected="true"] .st-label { color: #241703; }
.stage-tab.is-next[aria-selected="true"] .st-sub { color: #5C3D06; }
.stage-panel[hidden] { display: none; }

.stage-strip { display: grid; grid-template-columns: 210px 1fr; border: 2px solid var(--grid-hi); background: var(--panel); margin-bottom: 22px; }
@media (max-width: 700px) { .stage-strip { grid-template-columns: 1fr; } }

/* =========================== STAGE CARDS =========================== */
.stage-thumb { position: relative; background: #000; border-right: 2px solid var(--grid-hi); min-height: 168px; }
.stage-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.8) contrast(1.05); }
.stage-thumb::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px), rgba(12,19,14,0.12);
}
.stage-meta { padding: 16px 18px 18px; }
.stage-no {
  font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cyan);
}
.stage-course {
  font-family: 'Silkscreen', monospace; font-weight: 700;
  font-size: clamp(16px, 2.3vw, 24px); text-transform: uppercase; color: var(--paper);
  margin-top: 9px; line-height: 1.15;
}
.podium { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.pod {
  font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 0.05em;
  text-transform: uppercase; padding: 6px 9px; border: 2px solid;
}
.pod-1 { color: var(--amber);  border-color: var(--amber); }
.pod-2 { color: var(--paper);  border-color: var(--grid-hi); }
.pod-3 { color: var(--mute);   border-color: var(--grid-hi); }

.replay { margin-top: 16px; border-left: 4px solid var(--cyan); padding: 4px 0 4px 14px; }
.replay li { list-style: none; margin: 0 0 4px; color: var(--paper); font-size: 19px; }
.replay li::before { content: "\25B8 "; color: var(--cyan); }
.replay ul { margin: 0; padding: 0; }

/* ---- scorecard ---- */
.card-scroll { overflow-x: auto; border-top: 2px solid var(--grid-hi); }
table.score { width: 100%; border-collapse: collapse; font-size: 19px; }
table.score th, table.score td {
  padding: 5px 7px; text-align: center; white-space: nowrap;
  border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums;
}
table.score thead th {
  font-family: 'Silkscreen', monospace; font-weight: 400;
  font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--cyan); background: var(--panel-2); border-bottom: 2px solid var(--grid-hi);
  position: sticky; top: 0;
}
table.score td.who, table.score th.who {
  text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 2;
  font-family: 'Silkscreen', monospace; font-size: 10px; text-transform: uppercase;
  color: var(--paper); border-right: 2px solid var(--grid-hi); padding-right: 12px;
}
table.score thead th.who { background: var(--panel-2); z-index: 3; }
table.score tr.par-row td { color: var(--mute); background: #0E1710; }
table.score tr.par-row td.who { color: var(--cyan); background: #0E1710; }
table.score tr.win td.who { color: var(--amber); }
.s-under { color: var(--cyan); font-weight: 700; }
.s-par   { color: var(--phos); }
.s-bogey { color: var(--paper); }
.s-double{ color: #E8A33C; }
.s-blow  { color: var(--magenta); font-weight: 700; }
td.tot { color: var(--paper); border-left: 2px solid var(--grid-hi); }
td.pts { color: var(--phos); font-weight: 700; }
td.fin { font-family: 'Silkscreen', monospace; font-size: 12px; color: var(--paper); }
td.fin.first { color: var(--amber); }
.legend {
  display: flex; gap: 16px; flex-wrap: wrap; padding: 11px 18px;
  font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--mute); border-top: 2px solid var(--grid-hi);
}

/* =========================== HIGH SCORES =========================== */
.hs-row {
  display: grid; grid-template-columns: 58px 66px 1fr auto; gap: 16px; align-items: center;
  padding: 15px 18px; border-bottom: 2px solid var(--grid);
}
.hs-row:last-child { border-bottom: 0; }
.hs-rank { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 17px; color: var(--amber); }
.hs-face { width: 66px; height: 66px; border: 2px solid var(--grid-hi); background: #000; overflow: hidden; }
.hs-face img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.7) contrast(1.1); }
.hs-name { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: clamp(19px, 3vw, 30px); text-transform: uppercase; color: var(--phos); }
.hs-meta { color: var(--mute); font-size: 18px; margin-top: 3px; }
.hs-score { text-align: right; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: clamp(17px, 2.6vw, 26px); color: var(--paper); font-variant-numeric: tabular-nums; }
.hs-score span { display: block; font-weight: 400; font-size: 9px; letter-spacing: 0.08em; color: var(--cyan); margin-top: 6px; }
@media (max-width: 620px) {
  .hs-row { grid-template-columns: 44px 52px 1fr; }
  .hs-face { width: 52px; height: 52px; }
  .hs-score { grid-column: 2 / -1; text-align: left; }
}

/* =========================== AWARDS =========================== */
.award-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
.award { border: 2px solid var(--grid-hi); background: var(--panel); padding: 16px 16px 15px; }
.award.bad { border-color: #5C1231; background: #150A10; }
.award-k { font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--cyan); }
.award.bad .award-k { color: var(--magenta); }
.award-n { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--paper); margin-top: 9px; line-height: 1.25; }
.award-w { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: 21px; text-transform: uppercase; color: var(--amber); margin-top: 12px; }
.award.bad .award-w { color: var(--magenta); }
.award-s { color: var(--mute); font-size: 18px; margin-top: 8px; }

/* =========================== NEXT STAGE =========================== */
.timer { display: flex; gap: 10px; flex-wrap: wrap; }
.timer-cell { border: 2px solid var(--amber); background: #17110A; padding: 12px 16px 10px; min-width: 92px; text-align: center; }
.timer-num { font-family: 'Silkscreen', monospace; font-weight: 700; font-size: clamp(26px, 4.6vw, 42px); color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1; }
.timer-k { font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); margin-top: 9px; }

.brief { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
@media (max-width: 780px) { .brief { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .brief { grid-template-columns: 1fr; } }
.brief > div { padding: 14px 16px; border-right: 2px solid var(--grid-hi); border-bottom: 2px solid var(--grid-hi); }
.brief-k { font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--cyan); }

/* =========================================================================
   PURE COMPUTE — do not refactor, only extend.
   ========================================================================= */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function pointsForHole(scoresAtHole) {
  const ids = Object.keys(scoresAtHole);
  let min = Infinity;
  ids.forEach(id => { if (scoresAtHole[id] < min) min = scoresAtHole[id]; });
  const winners = ids.filter(id => scoresAtHole[id] === min);
  const out = {};
  ids.forEach(id => { out[id] = 0; });
  if (winners.length === 1) out[winners[0]] = 2;
  else winners.forEach(w => { out[w] = 1; });
  return out;
}

function computeTournamentStandings(tournament, course) {
  const scores = tournament.scores;
  const playerIds = Object.keys(scores);
  const holeCount = course.pars.length;

  const pointsByHole = [];
  const totalPoints = {};
  const totalStrokes = {};
  playerIds.forEach(id => { totalPoints[id] = 0; totalStrokes[id] = 0; });

  for (let h = 0; h < holeCount; h++) {
    const atHole = {};
    playerIds.forEach(id => { atHole[id] = scores[id][h]; });
    const pts = pointsForHole(atHole);
    pointsByHole.push(pts);
    playerIds.forEach(id => {
      totalPoints[id] += pts[id];
      totalStrokes[id] += scores[id][h];
    });
  }

  const coursePar = course.pars.reduce((a,b) => a+b, 0);

  const players = playerIds.map(id => ({
    playerId: id,
    totalPoints: totalPoints[id],
    totalStrokes: totalStrokes[id],
    overPar: totalStrokes[id] - coursePar,
  }));

  players.sort((a,b) => {
    if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
    return a.totalStrokes - b.totalStrokes;
  });

  players.forEach((p, i) => {
    p.rank = i + 1;
    p.tied = false;
  });
  for (let i = 0; i < players.length; i++) {
    for (let j = 0; j < players.length; j++) {
      if (i !== j
        && players[i].totalPoints === players[j].totalPoints
        && players[i].totalStrokes === players[j].totalStrokes) {
        players[i].tied = true;
        break;
      }
    }
  }

  return { pointsByHole, players, coursePar };
}

function computePlayerAggregates(d) {
  // Per player: sum of (gross − course par) and number of rounds played, across every tournament.
  const agg = {};
  d.tournaments.forEach(t => {
    const course = d.courses[t.courseId];
    const standings = computeTournamentStandings(t, course);
    standings.players.forEach(p => {
      if (!agg[p.playerId]) agg[p.playerId] = { sum: 0, rounds: 0 };
      agg[p.playerId].sum += p.overPar;
      agg[p.playerId].rounds += 1;
    });
  });
  const out = {};
  Object.keys(agg).forEach(id => {
    out[id] = { sum: agg[id].sum, rounds: agg[id].rounds, avg: agg[id].sum / agg[id].rounds };
  });
  return out;
}

function computeCombinedScores(d) {
  // Scoring AVERAGE = mean of (gross − course par) per round played.
  // Displayed in over/under-par style (e.g. +18, +32.5, E). A single-round player's
  // average equals that round's score.
  const agg = computePlayerAggregates(d);
  const out = {};
  Object.keys(agg).forEach(id => { out[id] = agg[id].avg; });
  return out;
}

function computeLeaderboard(d) {
  const championships = {};
  const finishes = {};
  const playedIds = new Set();

  d.tournaments.forEach(t => {
    const course = d.courses[t.courseId];
    const standings = computeTournamentStandings(t, course);
    standings.players.forEach(p => {
      playedIds.add(p.playerId);
      if (!finishes[p.playerId]) finishes[p.playerId] = {};
      finishes[p.playerId][t.id] = p.rank;
      if (p.rank === 1) {
        championships[p.playerId] = (championships[p.playerId] || 0) + 1;
      }
    });
  });

  const aggregates = computePlayerAggregates(d);

  const rows = [...playedIds].map(id => ({
    playerId: id,
    name: d.players[id].name,
    championships: championships[id] || 0,
    average: aggregates[id] ? aggregates[id].avg : undefined,
    rounds: aggregates[id] ? aggregates[id].rounds : 0,
    finishes: finishes[id] || {},
  }));

  rows.sort((a,b) => {
    if (b.championships !== a.championships) return b.championships - a.championships;
    if (a.average !== b.average) return a.average - b.average;
    return a.name.localeCompare(b.name);
  });

  return rows;
}

/* ---- new compute additions ---- */

// Worst single-hole score in a tournament. Returns all tied players at that score.
function computeBlowUp(tournament) {
  const scores = tournament.scores;
  const playerIds = Object.keys(scores);
  let max = -Infinity;
  const entries = [];
  playerIds.forEach(pid => {
    scores[pid].forEach((s, h) => {
      if (s > max) { max = s; entries.length = 0; entries.push({ player: pid, hole: h + 1, score: s }); }
      else if (s === max) { entries.push({ player: pid, hole: h + 1, score: s }); }
    });
  });

  // De-dupe by (player, hole) and order by player then hole
  entries.sort((a,b) => a.player.localeCompare(b.player) || a.hole - b.hole);

  const byPlayer = {};
  entries.forEach(e => {
    if (!byPlayer[e.player]) byPlayer[e.player] = [];
    byPlayer[e.player].push(e.hole);
  });
  const playerIdsList = Object.keys(byPlayer);
  const names = playerIdsList.map(p => data.players[p].name);
  const nameLine = names.length === 1
    ? names[0]
    : names.length === 2
      ? names.join(" & ")
      : names.slice(0, -1).join(", ") + " & " + names[names.length - 1];

  const segs = playerIdsList.map(p => {
    const holes = byPlayer[p];
    const noun = holes.length === 1 ? "hole" : "holes";
    return `${data.players[p].name} on ${noun} ${holes.join(", ")}`;
  });
  const subtitle = segs.join("; ");

  const displayLine = playerIdsList.length === 1 && byPlayer[playerIdsList[0]].length === 1
    ? `${nameLine} — ${max} on hole ${byPlayer[playerIdsList[0]][0]}`
    : `${nameLine} — ${max}s`;

  return { score: max, entries, byPlayer, nameLine, subtitle, displayLine };
}

// 3 deterministic story bullets summarising the round.
function computeRoundStory(tournament, course) {
  const standings = computeTournamentStandings(tournament, course);
  const winner = standings.players[0];
  const winnerName = data.players[winner.playerId].name;
  const blow = computeBlowUp(tournament);

  // Lead-change tracking: cumulative points after each hole.
  const playerIds = Object.keys(tournament.scores);
  const cum = {};
  playerIds.forEach(p => { cum[p] = 0; });
  let prevLeader = null;
  let leadChanges = 0;
  let leaderTookOverAtHole = null;
  let finalLeaderId = null;

  for (let h = 0; h < course.pars.length; h++) {
    playerIds.forEach(p => { cum[p] += standings.pointsByHole[h][p]; });
    let topPid = playerIds[0];
    playerIds.forEach(p => { if (cum[p] > cum[topPid]) topPid = p; });
    if (topPid !== prevLeader) {
      if (prevLeader !== null) leadChanges += 1;
      prevLeader = topPid;
      if (topPid === winner.playerId) leaderTookOverAtHole = h + 1;
    }
    finalLeaderId = topPid;
  }

  // Count of players who carded the worst-hole score anywhere (not just at the max).
  // Re-use blow score for narrative.
  const tenCount = (() => {
    let c = 0;
    playerIds.forEach(p => {
      tournament.scores[p].forEach(s => { if (s >= 10) c += 1; });
    });
    return c;
  })();

  const bullets = [];

  bullets.push(
    leadChanges === 0
      ? `${winnerName} led from the first hole and never gave it up.`
      : `Lead changed ${leadChanges} time${leadChanges === 1 ? "" : "s"} across 18 holes.`
  );

  if (leaderTookOverAtHole && leadChanges > 0) {
    bullets.push(`${winnerName} took the lead at hole ${leaderTookOverAtHole} and never relinquished it.`);
  } else {
    bullets.push(`Final margin: ${winner.totalPoints - (standings.players[1] ? standings.players[1].totalPoints : 0)} points.`);
  }

  if (tenCount > 0) {
    bullets.push(`${tenCount} player${tenCount === 1 ? "" : "s"} carded a 10 or worse. The blow-up was a ${blow.score} (${blow.displayLine}).`);
  } else {
    bullets.push(`Worst hole of the day: a ${blow.score} (${blow.displayLine}).`);
  }

  return bullets;
}

function computeHeroStats(d) {
  const tournamentsCount = d.tournaments.length;

  const everPlayed = new Set();
  let totalShots = 0;
  let totalHoles = 0;
  d.tournaments.forEach(t => {
    Object.keys(t.scores).forEach(pid => {
      everPlayed.add(pid);
      const arr = t.scores[pid];
      totalHoles += arr.length;
      for (let i = 0; i < arr.length; i++) totalShots += arr[i];
    });
  });

  let days = null;
  if (!d.upcoming.tbd && d.upcoming.date) {
    const target = new Date(d.upcoming.date + "T08:00:00-04:00");
    const now = new Date();
    const diffMs = target.getTime() - now.getTime();
    days = Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
  }

  return {
    tournaments: tournamentsCount,
    players: everPlayed.size,
    totalShots,
    totalHoles,
    daysToNextTee: days,
  };
}

/* =========================================================================
   HELPERS
   ========================================================================= */

function initialsFor(playerId, allPlayerIds, players) {
  const name = players[playerId].name;
  const lname = name.toLowerCase();
  const others = allPlayerIds
    .filter(id => id !== playerId)
    .map(id => players[id].name.toLowerCase());

  if (!others.some(n => n[0] === lname[0])) {
    return name[0].toUpperCase();
  }

  for (let i = 1; i < lname.length; i++) {
    const c = lname[i];
    const taken = others.some(n => n[0] === lname[0] && n[i] === c);
    if (!taken) {
      return name[0].toUpperCase() + name[i].toLowerCase();
    }
  }
  return name.slice(0, 2);
}

function formatCombinedScore(n) {
  if (n === undefined || n === null || Number.isNaN(n)) return "—";
  const r = Math.round(n * 10) / 10;
  const s = Number.isInteger(r) ? String(r) : r.toFixed(1);
  if (r > 0) return "+" + s;
  if (r < 0) return s;
  return "E";
}

function formatRank(p) {
  if (!p) return "—";
  return (p.tied ? "T" : "") + p.rank;
}

function formatTournamentDate(iso) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
  const [y, m, day] = iso.split("-").map(Number);
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${months[m-1]} ${day}, ${y}`;
}


function toRoman(n) {
  const map = [["M",1000],["CM",900],["D",500],["CD",400],["C",100],["XC",90],["L",50],["XL",40],["X",10],["IX",9],["V",5],["IV",4],["I",1]];
  let out = "";
  for (const [sym, val] of map) {
    while (n >= val) { out += sym; n -= val; }
  }
  return out;
}

function spriteByKey(key) {
  return SPRITE_DATA.sprites.find(sp => sp.key === key) || null;
}

function spriteSvg(sprite, cls) {
  const { w, h, palette } = SPRITE_DATA;
  let rects = "";
  sprite.rows.forEach((row, y) => {
    let x = 0;
    while (x < w) {
      const key = row[x];
      if (palette[key]) {
        let run = 1;
        while (x + run < w && row[x + run] === key) run += 1;
        rects += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${palette[key]}"/>`;
        x += run;
      } else {
        x += 1;
      }
    }
  });
  return `<svg class="sprite ${cls || ""}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(sprite.name)}">${rects}</svg>`;
}

function pad2(n) { return String(Math.max(0, n)).padStart(2, "0"); }

/* ---- HUD score bar ---- */
function renderHudScore(d) {
  const reigning = d.tournaments[d.tournaments.length - 1];
  const champ = computeTournamentStandings(reigning, d.courses[reigning.courseId]).players[0];
  const champName = d.players[champ.playerId].name;

  // Best round ever recorded, in strokes.
  let best = null;
  d.tournaments.forEach(t => {
    const st = computeTournamentStandings(t, d.courses[t.courseId]);
    st.players.forEach(p => {
      if (!best || p.totalStrokes < best.strokes) {
        best = { name: d.players[p.playerId].name, strokes: p.totalStrokes, roman: t.roman };
      }
    });
  });

  const credits = d.tournaments.length + 1;
  return `
    <span>Champ&nbsp; <b>${esc(champName.toUpperCase())}</b></span>
    <span>Best round&nbsp; <b class="gold">${esc(best.name.toUpperCase())}&nbsp;${best.strokes}</b></span>
    <span>Credits&nbsp; <b>${pad2(credits)}</b></span>
  `;
}

/* ---- 3. STAGE SELECT ---- */
function scoreClass(score, par) {
  if (par === undefined) return "s-par";
  const diff = score - par;
  if (diff <= -1) return "s-under";
  if (diff === 0) return "s-par";
  if (diff === 1) return "s-bogey";
  if (diff === 2) return "s-double";
  return "s-blow";
}

function renderScorecard(t, d) {
  const course = d.courses[t.courseId];
  const st = computeTournamentStandings(t, course);
  const holes = course.pars.length;

  const headCells = course.pars.map((_, i) => `<th>${i + 1}</th>`).join("");
  const parCells = course.pars.map(p => `<td>${p}</td>`).join("");
  const coursePar = course.pars.reduce((a, b) => a + b, 0);

  const rows = st.players.map(p => {
    const scores = t.scores[p.playerId];
    const cells = scores.map((s, i) =>
      `<td class="${scoreClass(s, course.pars[i])}">${s}</td>`
    ).join("");
    const overPar = p.overPar > 0 ? "+" + p.overPar : p.overPar < 0 ? String(p.overPar) : "E";
    return `
      <tr class="${p.rank === 1 ? "win" : ""}">
        <td class="who">${esc(d.players[p.playerId].name)}</td>
        ${cells}
        <td class="tot">${p.totalStrokes}</td>
        <td class="tot">${esc(overPar)}</td>
        <td class="pts">${p.totalPoints}</td>
        <td class="fin ${p.rank === 1 ? "first" : ""}">${esc(formatRank(p))}</td>
      </tr>
    `;
  }).join("");

  return `
    <div class="card-scroll">
      <table class="score">
        <thead>
          <tr>
            <th class="who">Player</th>
            ${headCells}
            <th>Str</th><th>+/-</th><th>Pts</th><th>Fin</th>
          </tr>
        </thead>
        <tbody>
          <tr class="par-row">
            <td class="who">Par</td>
            ${parCells}
            <td class="tot">${coursePar}</td><td class="tot">&mdash;</td><td>&mdash;</td><td class="fin">&mdash;</td>
          </tr>
          ${rows}
        </tbody>
      </table>
    </div>
    <div class="legend">
      <span style="color: var(--cyan);">&#9632; Birdie or better</span>
      <span style="color: var(--phos);">&#9632; Par</span>
      <span style="color: var(--paper);">&#9632; Bogey</span>
      <span style="color: #E8A33C;">&#9632; Double</span>
      <span style="color: var(--magenta);">&#9632; Triple or worse</span>
    </div>
  `;
}

function renderStages(d) {
  // One tab per tournament. Everything belonging to a stage lives inside its own tab:
  // its winner, its podium, its scorecard, its hardware. Nothing is repeated elsewhere.
  const played = d.tournaments.slice().sort((a, b) => a.id - b.id);
  const u = d.upcoming;
  const hasNext = u && !u.tbd && u.courseId;
  const nextRoman = toRoman(d.tournaments.length + 1);

  const tabs = played.map(t => {
    const course = d.courses[t.courseId];
    return {
      id: "stage-" + t.id,
      roman: t.roman,
      label: "Stage " + t.roman,
      sub: String(t.year),
      next: false,
      body: renderPlayedStage(t, d, course),
    };
  });

  if (hasNext) {
    tabs.push({
      id: "stage-next",
      roman: nextRoman,
      label: "Stage " + nextRoman,
      sub: "Next",
      next: true,
      body: renderNextStage(d),
    });
  }

  // The stage that matters today opens first: the one still to be played.
  const activeIndex = hasNext ? tabs.length - 1 : tabs.length - 1;

  const buttons = tabs.map((tab, i) => `
    <button class="stage-tab${tab.next ? " is-next" : ""}" role="tab"
            id="tab-${esc(tab.id)}" aria-controls="panel-${esc(tab.id)}"
            aria-selected="${i === activeIndex ? "true" : "false"}">
      <span class="st-label">${esc(tab.label)}</span>
      <span class="st-sub">${esc(tab.sub)}</span>
    </button>
  `).join("");

  const panels = tabs.map((tab, i) => `
    <div class="stage-panel" id="panel-${esc(tab.id)}" role="tabpanel"
         aria-labelledby="tab-${esc(tab.id)}" tabindex="0" ${i === activeIndex ? "" : "hidden"}>
      ${tab.body}
    </div>
  `).join("");

  return `
    <div class="sec-head">
      <div class="sec-title">Stage select</div>
      <div class="sec-rule"></div>
      <p class="sec-sub">One tab per tournament. Each stage carries its own winner, scorecard and hardware.</p>
    </div>
    <div class="stage-tabs" role="tablist" aria-label="Tournament">${buttons}</div>
    ${panels}
  `;
}

function renderPlayedStage(t, d, course) {
  const st = computeTournamentStandings(t, course);
  const names = st.players.slice(0, 3).map(p => d.players[p.playerId].name);
  const story = computeRoundStory(t, course).map(b => `<li>${esc(b)}</li>`).join("");

  return `
    <div class="stage-strip">
      <div class="stage-thumb">
        <img src="${esc(course.img || "img/stock/hero-fairway.jpg")}" alt="" loading="lazy" />
      </div>
      <div class="stage-meta">
        <div class="stage-no">Stage ${esc(t.roman)} &middot; cleared ${esc(t.year)} &middot; solo play</div>
        <div class="stage-course">${esc(course.name)}</div>
        <div style="color: var(--mute); margin-top: 6px;">${esc(formatTournamentDate(t.date))} &middot; ${esc(course.location)} &middot; Par ${course.pars.reduce((a,b)=>a+b,0)} &middot; field of ${st.players.length}</div>
        <div class="podium">
          <span class="pod pod-1">1st ${esc(names[0] || "-")}</span>
          <span class="pod pod-2">2nd ${esc(names[1] || "-")}</span>
          <span class="pod pod-3">3rd ${esc(names[2] || "-")}</span>
        </div>
      </div>
    </div>

    ${renderWinner(d, t)}

    <div class="panel" style="margin-top: 22px;">
      <div class="panel-head"><span>Replay</span><span class="rt">How the round actually went</span></div>
      <div class="panel-pad"><div class="replay"><ul>${story}</ul></div></div>
    </div>

    <div class="panel" style="margin-top: 18px;">
      <div class="panel-head"><span>Scorecard</span><span class="rt">Every hole, every player</span></div>
      ${renderScorecard(t, d)}
    </div>

    ${renderAwards(d, t)}
  `;
}

/* ---- 4. HIGH SCORES ---- */
function ordinal(n) {
  const suffix = (n % 100 >= 11 && n % 100 <= 13) ? "th"
    : ["th","st","nd","rd"][n % 10] || "th";
  return pad2(n) + suffix.toUpperCase();
}

function renderHighScores(d) {
  // A high-score board is ranked by score, not by date. In golf the low round wins,
  // so champions sort by strokes and the best round sits on top.
  const champs = d.tournaments.map(t => {
    const course = d.courses[t.courseId];
    const st = computeTournamentStandings(t, course);
    const champ = st.players[0];
    return {
      name: d.players[champ.playerId].name,
      strokes: champ.totalStrokes,
      points: champ.totalPoints,
      overPar: champ.overPar,
      runnerUp: st.players[1] ? d.players[st.players[1].playerId].name : "-",
      course, year: t.year, roman: t.roman,
      photo: d.championPortraits[champ.playerId]
        || (d.players[champ.playerId] && d.players[champ.playerId].photo)
        || "img/stock/champion-fallback.jpg",
    };
  }).sort((a, b) => a.strokes - b.strokes);

  const rows = champs.map((c, i) => `
      <div class="hs-row">
        <div class="hs-rank">${ordinal(i + 1)}</div>
        <div class="hs-face"><img src="${esc(c.photo)}" alt="" loading="lazy" /></div>
        <div>
          <div class="hs-name">${esc(c.name)}</div>
          <div class="hs-meta">Stage ${esc(c.roman)} &middot; ${esc(c.course.name)} &middot; ${esc(c.year)} &middot; runner-up ${esc(c.runnerUp)}</div>
        </div>
        <div class="hs-score">${c.strokes}<span>Strokes &middot; ${esc(formatCombinedScore(c.overPar))} &middot; ${c.points} pts</span></div>
      </div>
  `).join("");

  return `
    <div class="sec-head">
      <div class="sec-title">High scores</div>
      <div class="sec-rule"></div>
      <p class="sec-sub">Every champion, ranked by the round they won with. Low score takes the top slot.</p>
    </div>
    <div class="panel">
      <div class="panel-head"><span>Champions</span><span class="rt">Ranked by strokes</span></div>
      ${rows}
    </div>
  `;
}

/* ---- 5. AWARDS ---- */
function renderAwards(d, t) {
  if (!t || !t.awards || !t.awards.length) return "";

  const cards = t.awards.map(a => {
    const name = d.players[a.winner] ? d.players[a.winner].name : a.winner;
    const bad = a.tone === "bad";
    return `
      <div class="award ${bad ? "bad" : ""}">
        <div class="award-k">${bad ? "Penalty" : "Bonus"}</div>
        <div class="award-n">${esc(a.name)}</div>
        <div class="award-w">${esc(name)}</div>
        <div class="award-s">${a.stat ? esc(a.stat) + " " + esc(a.statLabel || "") + " &middot; " : ""}${esc(a.note || "")}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="panel" style="margin-top: 18px;">
      <div class="panel-head">
        <span>Bonus round</span>
        <span class="rt">Bonuses in gold &middot; penalties in red</span>
      </div>
      <div class="panel-pad"><div class="award-grid">${cards}</div></div>
    </div>
  `;
}

/* ---- 6. NEXT STAGE ---- */
function renderNextStage(d) {
  const u = d.upcoming;
  const course = upcomingCourse(d);
  if (u.tbd || !course) {
    return `<div class="panel panel-pad" style="color: var(--mute);">Course and date not set. Clear your calendar anyway.</div>`;
  }

  const dateStr = new Date(u.date + "T08:00:00-04:00").toLocaleDateString("en-US", {
    weekday: "long", month: "long", day: "numeric", year: "numeric", timeZone: "America/Toronto"
  });

  const ordinary = u.rules.filter(r => !r.key).map(r => `
    <div class="howto-item">
      <div class="howto-n">${esc(r.title)}</div>
      <p class="howto-b">${esc(r.body)}</p>
    </div>
  `).join("");
  const key = u.rules.filter(r => r.key).map(r => `
    <div class="howto-key">
      <div class="howto-n">&#9733; ${esc(r.title)}</div>
      <p class="howto-b">${esc(r.body)}</p>
    </div>
  `).join("");

  const brief = [
    ["Date", dateStr],
    ["Tee window", u.teeTime + " to " + u.lastTee + " &middot; Eastern"],
    ["Get there", u.arriveBy],
    ["Mode", u.formatName],
    ["Card", "Par " + course.par + " &middot; " + course.yardage.toLocaleString() + " yards &middot; " + course.rating],
    ["Course", '<a href="' + esc(course.website) + '" target="_blank" rel="noopener">' + esc(course.name) + "</a>"],
  ].map(([k, v]) => `<div><div class="brief-k">${esc(k)}</div><div class="brief-v">${v}</div></div>`).join("");

  return `
    <p class="sec-sub" style="margin: 0 0 18px;">${esc(u.formatBlurb)} Five squads, five captains, one trophy.</p>

    <div class="crt-photo" style="margin-bottom: 18px;">
      <img src="${esc(course.img)}" alt="${esc(course.name)}" loading="lazy" style="max-height: 340px; object-fit: cover;" />
      <span class="corner c1"></span><span class="corner c2"></span>
      <span class="corner c3"></span><span class="corner c4"></span>
    </div>

    <div class="panel" style="margin-bottom: 18px;">
      <div class="panel-head"><span>Time to tee off</span><span class="rt">${esc(course.name)} &middot; ${esc(course.location)}</span></div>
      <div class="panel-pad">
        <div class="timer" id="timer"></div>
        <div class="brief" style="margin-top: 22px; border-top: 2px solid var(--grid-hi); border-left: 2px solid var(--grid-hi);">${brief}</div>
      </div>
    </div>

    <div class="panel" style="margin-bottom: 18px;">
      <div class="panel-head"><span>How to play</span><span class="rt">Read the cabinet before you swing</span></div>
      <div class="panel-pad">
        <div class="howto">${ordinary}</div>
        ${key}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span>Select your squad</span><span class="rt">Double-tee start &middot; groups 1 and 3 off hole 1</span></div>
      <div class="panel-pad">
        <div class="select-grid">${u.teams.map(t => renderTeamCard(t, d)).join("")}</div>
      </div>
    </div>
  `;
}

/* ---- 7. RANKINGS ---- */
function renderRankings(d) {
  const rows = computeLeaderboard(d);
  const heads = d.tournaments.map(t => `<th>S${pad2(t.id)}</th>`).join("");

  const body = rows.map((r, i) => {
    const fin = d.tournaments.map(t => {
      const rank = r.finishes[t.id];
      return `<td class="dim">${rank ? rank : "&mdash;"}</td>`;
    }).join("");
    return `
      <tr class="${r.championships > 0 ? "champ" : ""}">
        <td class="pos">${pad2(i + 1)}</td>
        <td class="who">${esc(r.name)}</td>
        <td class="titles ${r.championships ? "" : "zero"}">${r.championships}</td>
        <td class="avg">${esc(formatCombinedScore(r.average))}</td>
        <td class="dim">${r.rounds}</td>
        ${fin}
      </tr>
    `;
  }).join("");

  return `
    <div class="sec-head">
      <div class="sec-title">All-time rankings</div>
      <div class="sec-rule"></div>
      <p class="sec-sub">Solo play only. Sorted by titles, then scoring average. A team stage never moves these numbers.</p>
    </div>
    <div class="panel">
      <div class="card-scroll" style="border-top: 0;">
        <table class="rank">
          <thead>
            <tr>
              <th>Pos</th><th class="who">Player</th><th>Titles</th><th>Avg</th><th>Rds</th>${heads}
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
  `;
}

/* =========================================================================
   ATTRACT-MODE DEMO
   A side-on golf game plays behind the page: address, swing, ball flight,
   roll, then the camera pans to the pin and the next hole starts.

   Drawn at quarter resolution and scaled up, so it stays chunky like a
   period cabinet and costs almost nothing to run.
   ========================================================================= */
(function attractDemo() {
  const canvas = document.getElementById("attract-demo");
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d", { alpha: true });
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const SCALE = 5;              // one drawn pixel = 5 screen pixels
  const GRAV = 0.16;
  const C = {
    sky:     "#0A1410",
    hillFar: "#16301F",
    hillMid: "#1E4429",
    turf:    "#2C6B3C",
    turfLip: "#4BE87C",
    tree:    "#123A22",
    treeLit: "#1B5231",
    trail:   "#2E7A46",
    trunk:   "#3A2A1C",
    body:    "#EDEDE1",
    skin:    "#E9B384",
    hair:    "#5B4230",
    club:    "#9AA6AE",
    ball:    "#FFFFFF",
    pole:    "#C8D2CC",
    flag:    "#FFC233",
  };

  let W = 0, H = 0;

  function resize() {
    W = Math.ceil(window.innerWidth / SCALE);
    H = Math.ceil(window.innerHeight / SCALE);
    canvas.width = W;
    canvas.height = H;
    ctx.imageSmoothingEnabled = false;
  }

  // Deterministic rolling terrain, so the course looks the same every pass.
  const HORIZON = () => Math.min(H * 0.66, H - 42);
  function groundY(x) {
    return HORIZON()
      + Math.sin(x * 0.0090) * (H * 0.040)
      + Math.sin(x * 0.0227) * (H * 0.016)
      + Math.sin(x * 0.0041) * (H * 0.022);
  }

  const px = (x, y, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  };

  function drawTree(x, baseY, size) {
    const trunk = size * 0.30;
    px(x - 1, baseY - trunk, 3, trunk, C.trunk);
    // stepped conifer: each tier narrower than the one below it
    const tiers = 4;
    for (let i = 0; i < tiers; i++) {
      const w = size * (0.78 - i * 0.17);
      const h = size * 0.20;
      const y = baseY - trunk - (i + 1) * h * 0.82;
      px(x - w / 2, y, w, h, i === 0 ? C.tree : C.treeLit);
    }
  }

  // ---- game state ----
  let hole, golfer, ball, phase, timer, camX, camTarget, holeIndex = 0;
  let trail = [];

  // Run the shot physics headlessly and report where the ball would come to rest.
  // Used to pick a power that finishes near the flag instead of guessing at constants.
  function simulateFinish(teeX, power, angle) {
    let x = teeX + 6, y = groundY(teeX) - 2;
    let vx = Math.cos(-angle) * power, vy = Math.sin(-angle) * power;
    let flying = true, guard = 0;
    while (flying && guard++ < 4000) {
      x += vx; y += vy; vy += GRAV;
      const g = groundY(x) - 2;
      if (y >= g) {
        y = g;
        if (Math.abs(vy) > 1.1) { vy *= -0.42; vx *= 0.72; }
        else { flying = false; vy = 0; vx *= 0.6; }
      }
    }
    while (Math.abs(vx) > 0.06 && guard++ < 4000) { x += vx; vx *= 0.965; }
    return x;
  }

  function powerToReach(teeX, targetX, angle) {
    let lo = 2, hi = 14;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2;
      if (simulateFinish(teeX, mid, angle) < targetX) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  function newHole() {
    holeIndex += 1;
    const teeX = 40;
    const pinX = teeX + 250 + ((holeIndex * 137) % 90);
    const angle = 0.94 + ((holeIndex * 31) % 11) / 46;
    // Aim at the flag, then miss it a little. Nobody sticks every drive.
    const miss = ((holeIndex * 97) % 61) - 30;
    hole = {
      teeX, pinX, angle,
      power: powerToReach(teeX, pinX + miss, angle),
    };
    golfer = { x: teeX, y: groundY(teeX) };
    ball = { x: teeX + 6, y: groundY(teeX) - 2, vx: 0, vy: 0, flying: false, rolling: false };
    phase = "address";
    timer = 0;
    trail = [];
    camX = teeX - W * 0.28;
    camTarget = camX;
  }

  function step(dt) {
    timer += dt;

    if (phase === "address" && timer > 1.15) { phase = "back"; timer = 0; }
    else if (phase === "back" && timer > 0.42) { phase = "swing"; timer = 0; }
    else if (phase === "swing" && timer > 0.10) {
      ball.vx = Math.cos(-hole.angle) * hole.power;
      ball.vy = Math.sin(-hole.angle) * hole.power;
      ball.flying = true;
      phase = "flight"; timer = 0;
    }

    if (ball.flying) {
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 26) trail.shift();
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vy += GRAV;
      const g = groundY(ball.x) - 2;
      if (ball.y >= g) {
        ball.y = g;
        if (Math.abs(ball.vy) > 1.1) {          // bounce
          ball.vy *= -0.42;
          ball.vx *= 0.72;
        } else {                                 // settle into a roll
          ball.flying = false;
          ball.rolling = true;
          ball.vy = 0;
          ball.vx *= 0.6;
          phase = "roll"; timer = 0;
        }
      }
    } else if (ball.rolling) {
      ball.x += ball.vx;
      ball.y = groundY(ball.x) - 2;
      ball.vx *= 0.965;
      if (Math.abs(ball.vx) < 0.06) {
        ball.rolling = false;
        phase = "rest"; timer = 0;
      }
    }

    if (phase === "rest" && timer > 1.5) { phase = "pan"; timer = 0; }
    if (phase === "pan" && timer > 2.4) { newHole(); }

    // camera: sit on the tee, follow the ball, then settle on the pin
    if (phase === "address" || phase === "back" || phase === "swing") camTarget = golfer.x - W * 0.28;
    else if (phase === "pan") camTarget = hole.pinX - W * 0.62;
    else camTarget = ball.x - W * 0.42;
    camX += (camTarget - camX) * Math.min(1, dt * 2.4);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // parallax ridgelines
    for (let layer = 0; layer < 2; layer++) {
      const par = layer === 0 ? 0.35 : 0.6;
      const lift = layer === 0 ? H * 0.10 : H * 0.045;
      ctx.fillStyle = layer === 0 ? C.hillFar : C.hillMid;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let sx = 0; sx <= W; sx += 2) {
        const wx = (camX * par) + sx;
        ctx.lineTo(sx, groundY(wx) - lift);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }

    // fairway
    ctx.fillStyle = C.turf;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let sx = 0; sx <= W; sx += 1) ctx.lineTo(sx, groundY(camX + sx));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // a lit rim along the turf so the ground edge reads
    for (let sx = 0; sx <= W; sx += 1) px(sx, groundY(camX + sx), 1, 1, C.turfLip);

    // trees on a fixed world grid
    const first = Math.floor(camX / 90) * 90;
    for (let wx = first; wx < camX + W + 90; wx += 90) {
      if ((Math.floor(wx / 90) % 3) === 0) continue;
      drawTree(wx - camX, groundY(wx), H * 0.16);
    }

    // pin
    const pinSX = hole.pinX - camX;
    if (pinSX > -20 && pinSX < W + 20) {
      const py = groundY(hole.pinX);
      px(pinSX, py - 26, 1, 26, C.pole);
      const wave = Math.sin(performance.now() / 220) * 1.4;
      ctx.fillStyle = C.flag;
      ctx.beginPath();
      ctx.moveTo(pinSX + 1, py - 26);
      ctx.lineTo(pinSX + 12 + wave, py - 22);
      ctx.lineTo(pinSX + 1, py - 18);
      ctx.closePath();
      ctx.fill();
      px(pinSX - 3, py - 1, 7, 1, "#0A1410");
    }

    // golfer
    const gx = golfer.x - camX, gy = golfer.y;
    if (gx > -30 && gx < W + 30) {
      const bob = phase === "address" ? Math.sin(performance.now() / 300) * 0.7 : 0;
      const top = gy - 22 + bob;
      px(gx - 4, top,       8, 5, C.hair);
      px(gx - 4, top + 4,   8, 5, C.skin);
      px(gx - 6, top + 9,  12, 8, C.body);
      px(gx - 5, top + 17,  4, 6, C.body);
      px(gx + 1, top + 17,  4, 6, C.body);
      px(gx - 5, top + 22,  4, 2, "#1A211C");
      px(gx + 1, top + 22,  4, 2, "#1A211C");

      // club swings through its arc
      let a;
      if (phase === "address") a = 0.5;
      else if (phase === "back") a = 0.5 - (timer / 0.42) * 3.0;
      else if (phase === "swing") a = -2.5 + (timer / 0.10) * 3.4;
      else a = 0.9;
      const hx = gx + 4, hy = top + 11;
      ctx.strokeStyle = C.club;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx + Math.cos(a) * 19, hy + Math.sin(a) * 19);
      ctx.stroke();
    }

    // ball, with a fading trail so the shot reads as a shot
    trail.forEach((t, i) => {
      const tx = t.x - camX;
      if (tx > -4 && tx < W + 4) {
        ctx.globalAlpha = (i / trail.length) * 0.5;
        px(tx, t.y, 2, 2, C.trail);
        ctx.globalAlpha = 1;
      }
    });
    const bx = ball.x - camX;
    if (bx > -4 && bx < W + 4) {
      px(bx - 1, ball.y - 1, 4, 4, "#0A1410");
      px(bx, ball.y, 2, 2, C.ball);
    }
  }

  let last = 0, running = true;
  function frame(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  newHole();

  if (reduce) {
    // Hold a single composed frame rather than animating.
    for (let i = 0; i < 90; i++) step(0.05);
    draw();
  } else {
    requestAnimationFrame(now => { last = now; frame(now); });
  }

  // Test seam: ?debug lets the demo be advanced by hand, since requestAnimationFrame
  // is throttled in a background tab and the loop cannot be observed otherwise.
  if (location.search.indexOf("debug") !== -1) {
    window.__demo = {
      tick(dt, n) { for (let i = 0; i < (n || 1); i++) step(dt || 0.016); draw(); },
      state() { return { phase, holeIndex, ball: { ...ball }, camX, trail: trail.length, pinX: hole.pinX }; },
    };
  }

  window.addEventListener("resize", () => { resize(); draw(); });
  // Idle demos should not burn cycles on a tab nobody is looking at.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { running = false; }
    else if (!reduce && !running) { running = true; requestAnimationFrame(now => { last = now; frame(now); }); }
  });
})();

/* ---- countdown as a cabinet timer ---- */
(function startTimer() {
  const mount = document.getElementById("timer");
  if (!mount || data.upcoming.tbd || !data.upcoming.date) return;
  const target = new Date(data.upcoming.date + "T08:00:00-04:00");

  function cell(v, k) {
    return `<div class="timer-cell"><div class="timer-num">${pad2(v)}</div><div class="timer-k">${k}</div></div>`;
  }
  function tick() {
    const diff = target.getTime() - Date.now();
    if (diff <= 0) { mount.innerHTML = `<div class="timer-cell" style="min-width:auto;"><div class="timer-num">Tee it up</div></div>`; return; }
    const totalSec = Math.floor(diff / 1000);
    mount.innerHTML =
      cell(Math.floor(totalSec / 86400), "Days") +
      cell(Math.floor((totalSec % 86400) / 3600), "Hrs") +
      cell(Math.floor((totalSec % 3600) / 60), "Min") +
      cell(totalSec % 60, "Sec");
  }
  tick();
  setInterval(tick, 1000);
})();

/* ---- stage tabs ---- */
(function stageTabs() {
  const tabs = Array.from(document.querySelectorAll(".stage-tab"));
  if (!tabs.length) return;
  function select(tab) {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute("aria-selected", on ? "true" : "false");
      const panel = document.getElementById("panel-" + t.id.replace(/^tab-/, ""));
      if (panel) panel.hidden = !on;
    });
  }
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => select(tab));
    tab.addEventListener("keydown", ev => {
      if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
      ev.preventDefault();
      const next = tabs[(i + (ev.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
      next.focus(); select(next);
    });
  });
})();

/* ---- boot sequence: the one piece of non-user motion on the page ---- */
(function boot() {
  const el = document.getElementById("boot");
  if (!el) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.remove(); return; }

  const stats = computeHeroStats(data);
  const nextCourse = data.upcoming.courseId ? data.courses[data.upcoming.courseId].name : "to be confirmed";
  const lines = [
    "Whitby Invitational System",
    "Rom check .......... ok",
    "Scorecards ......... " + stats.tournaments + " stages",
    "Field .............. " + stats.players + " golfers",
    "Next stage ......... " + nextCourse,
    "Ready.",
  ];
  const mount = el.querySelector(".lines");
  let i = 0;
  const t = setInterval(() => {
    const p = document.createElement("p");
    if (i === lines.length - 1) p.style.color = "var(--amber)";
    else if (i > 0) p.className = "ok";
    p.textContent = lines[i];
    mount.appendChild(p);
    i += 1;
    if (i >= lines.length) {
      clearInterval(t);
      setTimeout(() => {
        el.classList.add("done");
        setTimeout(() => el.remove(), 400);
      }, 420);
    }
  }, 170);
})();

/* ---- self-tests: the numbers must match the live site exactly ---- */
(function selfTests() {
  const fails = [];
  const check = (c, m) => { if (!c) { fails.push(m); console.error("ASSERT FAIL:", m); } };

  const t1 = data.tournaments.find(t => t.id === 1);
  const s1 = computeTournamentStandings(t1, data.courses[t1.courseId]);
  check(s1.players[0].playerId === "gibbs", "Stage 1 winner should be Gibbs");
  check(s1.players[0].totalStrokes === 88, "Gibbs should card 88");

  const t2 = data.tournaments.find(t => t.id === 2);
  const s2 = computeTournamentStandings(t2, data.courses[t2.courseId]);
  check(s2.players[0].playerId === "traikos", "Stage 2 winner should be Traikos");

  const lb = computeLeaderboard(data);
  check(lb.length === 15, `Rankings should list 15 players, got ${lb.length}`);
  check(lb[0].playerId === "gibbs", "Rankings should be led by Gibbs");

  check(data.upcoming.teams.length === 5, "Five squads on the select screen");
  data.upcoming.teams.forEach(t => {
    check(t.players[0] === t.captain, `${t.name}: captain leads the roster`);
    t.players.forEach(p => check(!!data.players[p], `${t.name}: unknown player ${p}`));
  });

  ["attract","stages","highscores","rankings"].forEach(id => {
    check(document.getElementById(id).innerHTML.trim().length > 0, `Section #${id} rendered empty`);
  });

  // One tab per played stage, plus the upcoming one.
  const tabCount = document.querySelectorAll(".stage-tab").length;
  const expectedTabs = data.tournaments.length + (data.upcoming && !data.upcoming.tbd ? 1 : 0);
  check(tabCount === expectedTabs, `Expected ${expectedTabs} stage tabs, got ${tabCount}`);
  check(document.querySelectorAll('.stage-tab[aria-selected="true"]').length === 1, "Exactly one stage tab is open");
  check(document.querySelectorAll(".stage-panel:not([hidden])").length === 1, "Exactly one stage panel is visible");

  // Awards belong to their own stage, never to the page.
  const awardStages = data.tournaments.filter(t => t.awards && t.awards.length).length;
  check(document.querySelectorAll(".award-grid").length === awardStages,
    `Award grids should equal stages with hardware (${awardStages})`);

  // Every captain has a fighter, and every fighter is a real captain.
  check(SPRITE_DATA.sprites.length === 6, "Six characters in the roster");
  SPRITE_DATA.sprites.forEach(sp => {
    if (sp.key === "trophy") return;
    check(!!data.players[sp.key], `Fighter ${sp.key} must be a real player`);
    check(data.upcoming.teams.some(t => t.captain === sp.key), `Fighter ${sp.key} must be a team captain`);
  });
  data.upcoming.teams.forEach(t => {
    check(!!spriteByKey(t.captain), `${t.name}: captain ${t.captain} has no fighter`);
  });

  // Squad cards carry their captain's portrait (rendered in both stage tabs).
  const portraits = document.querySelectorAll(".team-portrait").length;
  const cards = document.querySelectorAll(".team").length;
  check(portraits === cards, `Every squad card needs a portrait: ${portraits} of ${cards}`);

  // The attract demo runs behind the content and never intercepts clicks.
  const demo = document.getElementById("attract-demo");
  check(!!demo, "Attract demo canvas must exist");
  check(getComputedStyle(demo).pointerEvents === "none", "Demo canvas must not catch clicks");
  check(demo.width > 0 && demo.height > 0, `Demo canvas must be sized, got ${demo.width}x${demo.height}`);
  check(Number(getComputedStyle(demo).zIndex) < 2, "Demo canvas must sit behind the page content");
  check(getComputedStyle(demo).position === "fixed", "Demo canvas must not extend the page");

  console.log(fails.length ? "%c✗ arcade draft: " + fails.join(" | ") : "%c✓ arcade draft self-tests passed",
    fails.length ? "color:#FF3D7F" : "color:#4BE87C;font-weight:600");
})();
</script>
